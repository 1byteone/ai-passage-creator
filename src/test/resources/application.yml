spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:ai_passage_creator_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  session:
    store-type: none
  batch:
    jdbc:
      initialize-schema: never
  sql:
    init:
      mode: never
  ai:
    dashscope:
      api-key: test-dashscope-key
    openai:
      api-key: test-openai-key

tencent:
  cos:
    secret-id: test-cos-secret-id
    secret-key: test-cos-secret-key
    region: ap-guangzhou
    bucket: test-cos-bucket

pexels:
  api-key: test-pexels-key

stripe:
  api-key: test-stripe-key
  webhook-secret: test-stripe-webhook-secret
  success-url: http://localhost:5173/vip?success=true
  cancel-url: http://localhost:5173/vip?cancelled=true
