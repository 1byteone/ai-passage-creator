# 服务器配置
server:
  port: 8567
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

spring:
  application:
    name: ai-passage-creator
  main:
    allow-bean-definition-overriding: true
  # MySQL 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_passage_creator}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # Flyway 数据库迁移：生产/本地 schema 由迁移文件管理
  # baseline-on-migrate + baseline-version=0 + V1 全幂等 → 既有手工 SQL 库与全新空库收敛到同一 schema
  # {vendor} 让 MySQL 专属迁移（db/vendor/mysql/V3 补列）在 MySQL 上执行；
  # 独立 vendor 目录避免被 db/migration 的递归扫描拉到 H2 上误执行
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
    baseline-on-migrate: true
    baseline-version: 0
  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
    openai:
      api-key: ${AGNES_API_KEY:${AGNES_AI_API_KEY:}}
      base-url: https://api.agnes-ai.cn
      chat:
        options:
          model: agnes-2.5-flash
          temperature: 0.7
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        initialize-schema: true

mybatis-flex:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    print-banner: false

# springdoc-openapi 配置
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.example.aipassagecreator.controller
# knife4j 接口文档配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# 腾讯云 COS 配置
tencent:
  cos:
    secret-id: ${TENCENT_COS_SECRET_ID:}
    secret-key: ${TENCENT_COS_SECRET_KEY:}
    region: ${TENCENT_COS_REGION:ap-guangzhou}
    bucket: ${TENCENT_COS_BUCKET:}

pexels:
  api-key: ${PEXELS_API_KEY:}

# Mermaid 图表生成配置
mermaid:
  cli-command: mmdc
  background-color: transparent
  output-format: svg
  width: 1200
  timeout: 30000

# Iconify 图标库配置
iconify:
  api-url: https://api.iconify.design
  search-limit: 10
  default-height: 64
  default-color: ""

# 表情包图片检索配置
emoji-pack:
  search-url: https://cn.bing.com/images/async
  suffix: 熊猫头表情包
  timeout: 10000

# SVG 概念示意图生成配置
svg-diagram:
  default-width: 800
  default-height: 600
  folder: svg-diagrams

# Stripe 支付配置（测试模式）
stripe:
  api-key: ${STRIPE_API_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:5173/vip?success=true}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:5173/vip?cancelled=true}

# 模型路由配置
model:
  router:
    default: agnes
    skill-default: agnes
    article-default: dashscope
    fallback: dashscope
    image-model: agnes-image-2.1-flash

# LangSearch 搜索 API（research skill 使用）
langsearch:
  api-key: ${LANGSEARCH_API_KEY:}

# RAG 向量检索（pgvector 配置并入主 spring.ai 块，见上方；此处仅业务开关）
rag:
  vectorstore:
    # auto: 有 SUPABASE_DB_URL 凭据 → pgvector，否则内存 SimpleVectorStore
    # pgvector / memory / redis: 强制指定
    active: auto
  knowledge:
    # 当前项目工作树；同步器只读取固定根文档和 docs/knowledge/**/*.md
    source-root: ${RAG_KNOWLEDGE_SOURCE_ROOT:.}
    branch: ${RAG_KNOWLEDGE_BRANCH:dev_rag}

# Webhook 共享签名密钥（生产必填；留空则 WebhookService 启动失败）
webhook:
  shared-secret: ${WEBHOOK_SHARED_SECRET:}

# Skill 超时确认收割间隔（毫秒）
skill:
  confirmation:
    reap-interval-ms: 120000

# 文章智能体配置
article:
  agent:
    orchestrator:
      enabled: true
    max-iterations: 10
  # 创作质量门 — 生成后自动检测反AI味，未通过则触发改写
  quality-gate:
    enabled: true
    auto-detox: true
    detox-intensity: medium
    pass-threshold: 50

# 手写效果子系统配置
handwriting:
  render:
    cos-base-url: ${TENCENT_COS_BUCKET}.cos.${TENCENT_COS_REGION:ap-guangzhou}.myqcloud.com
    render-timeout-sec: 30
    batch-timeout-sec: 120
    viewport-width: 1240
    viewport-height: 1754
    device-scale-factor: 2.0
  fonts:
    # 手写字体 COS 路径前缀
    cos-prefix: handwriting/fonts
    # MVP 字体列表（SIL OFL 授权）
    available:
      - name: 猫啃硬笔楷书
        key: maoken-yingbi
        file: maoken-yingbi.ttf
      - name: 写意体
        key: xieyi
        file: xieyi.ttf
      - name: 随峰体Plus
        key: suifeng-plus
        file: suifeng-plus.ttf
      - name: Y式笔书体
        key: yshi-bishu
        file: yshi-bishu.ttf
      - name: 荷塘月色手写体
        key: hetang-yuese
        file: hetang-yuese.ttf
      - name: 油茶馓子体
        key: youcha-sanzi
        file: youcha-sanzi.ttf
      - name: 白路棒棒手写体
        key: bailu-bangbang
        file: bailu-bangbang.ttf
  papers:
    # 纸张类型
    types:
      - blank
      - line
      - grid
      - tianzi
      - dot
