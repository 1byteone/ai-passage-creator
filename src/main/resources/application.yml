# 服务器配置
server:
  port: 8567
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

spring:
  application:
    name: ai-passage-creator
  # MySQL 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_passage_creator}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
    openai:
      api-key: ${AGNES_AI_API_KEY:}
      base-url: https://api.agnes-ai.cn
      chat:
        options:
          model: agnes-2.5-flash
          temperature: 0.7

mybatis-flex:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    print-banner: false

# springdoc-openapi 配置
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.example.aipassagecreator.controller
# knife4j 接口文档配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# 腾讯云 COS 配置
tencent:
  cos:
    secret-id: ${TENCENT_COS_SECRET_ID:}
    secret-key: ${TENCENT_COS_SECRET_KEY:}
    region: ${TENCENT_COS_REGION:ap-guangzhou}
    bucket: ${TENCENT_COS_BUCKET:}

pexels:
  api-key: ${PEXELS_API_KEY:}

# Mermaid 图表生成配置
mermaid:
  cli-command: mmdc
  background-color: transparent
  output-format: svg
  width: 1200
  timeout: 30000

# Iconify 图标库配置
iconify:
  api-url: https://api.iconify.design
  search-limit: 10
  default-height: 64
  default-color: ""

# 表情包图片检索配置
emoji-pack:
  search-url: https://cn.bing.com/images/async
  suffix: 熊猫头表情包
  timeout: 10000

# SVG 概念示意图生成配置
svg-diagram:
  default-width: 800
  default-height: 600
  folder: svg-diagrams

# Stripe 支付配置（测试模式）
stripe:
  api-key: ${STRIPE_API_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:5173/vip?success=true}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:5173/vip?cancelled=true}

# 模型路由配置
model:
  router:
    default: agnes
    skill-default: agnes
    article-default: dashscope
    fallback: dashscope
    image-model: agnes-image-2.1-flash

# LangSearch 搜索 API（research skill 使用）
langsearch:
  api-key: ${LANGSEARCH_API_KEY:}

# Skill 超时确认收割间隔（毫秒）
skill:
  confirmation:
    reap-interval-ms: 120000

# 文章智能体配置
article:
  agent:
    orchestrator:
      enabled: true
    max-iterations: 10
