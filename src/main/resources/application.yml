# 服务器配置
server:
  port: 8567
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

spring:
  application:
    name: ai-passage-creator
  # MySQL 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_passage_creator}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}

    # AGNES AI 模型 (OpenAI 兼容)
    openai:
      api-key: ${AGNES_AI_API_KEY:}
      base-url: https://apihub.agnes-ai.com
      chat:
        options:
          model: agnes-2.0-flash
          temperature: 0.7

# 模型路由配置
model:
  router:
    default: agnes                    # 全局默认模型
    skill-default: agnes              # Skill 引擎默认模型
    article-default: dashscope         # 文章写作默认模型
    fallback: dashscope               # AGNES 不可用时降级
    image-model: agnes-image-2.1-flash  # 图片生成模型

mybatis-flex:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    print-banner: false

# springdoc-openapi 配置
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.example.aipassagecreator.controller
# knife4j 接口文档配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# 腾讯云 COS 配置（可选，MVP 阶段可以不配置）
tencent:
  cos:
    secret-id: ${TENCENT_COS_SECRET_ID:}
    secret-key: ${TENCENT_COS_SECRET_KEY:}
    region: ${TENCENT_COS_REGION:ap-guangzhou}
    bucket: ${TENCENT_COS_BUCKET:}

pexels:
  api-key: ${PEXELS_API_KEY:}

# Mermaid 图表生成配置
mermaid:
  cli-command: mmdc  # CLI 命令（Windows 下会自动使用 mmdc.cmd）
  background-color: transparent  # 背景颜色
  output-format: svg  # 输出格式（svg/png/pdf）
  width: 1200  # 图片宽度（像素）
  timeout: 30000  # 命令执行超时时间（毫秒）

# Iconify 图标库配置
iconify:
  api-url: https://api.iconify.design
  search-limit: 10
  default-height: 64
  default-color: ""  # 留空使用 currentColor，或设置如 "#000000"

# 表情包图片检索配置
emoji-pack:
  search-url: https://cn.bing.com/images/async
  suffix: 熊猫头表情包
  timeout: 10000  # 请求超时（毫秒）

# SVG 概念示意图生成配置
svg-diagram:
  default-width: 800
  default-height: 600
  folder: svg-diagrams  # COS 存储文件夹

# Stripe 支付配置（测试模式）
stripe:
  api-key: ${STRIPE_API_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:5173/vip?success=true}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:5173/vip?cancelled=true}

# 文章智能体配置
article:
  agent:
    orchestrator:
      # 是否启用多智能体编排模式（支持配图并行生成）
      # true: 使用 Spring AI Alibaba 多智能体编排
      # false: 使用原有的 ArticleAgentService
      enabled: true
    # Agent 最大迭代次数
    max-iterations: 10
