spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:ai_passage_creator_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  session:
    store-type: redis
    timeout: 2592000
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password: 123456
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/h2-schema.sql
  # 测试用 H2 + sql.init 建表，不走 Flyway（迁移集由 FlywayMigrationCompatibilityTest 独立验证）
  flyway:
    enabled: false
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:test}
    openai:
      api-key: ${AGNES_AI_API_KEY:test}
      base-url: https://api.agnes-ai.cn
      chat:
        options:
          model: agnes-2.5-flash
          temperature: 0.7

model:
  router:
    default: agnes
    skill-default: agnes
    article-default: dashscope
    fallback: dashscope
    image-model: agnes-image-2.1-flash

# 测试固定内存向量库：不依赖外部 Supabase（系统环境变量 SUPABASE_DB_URL 可能触发
# auto 模式去连真实 pgvector，CI/本地无网络时上下文加载直接失败）
rag:
  vectorstore:
    active: memory