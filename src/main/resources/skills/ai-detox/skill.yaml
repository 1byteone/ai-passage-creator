name: ai-detox
description: 审计并优化文章的自然度、清晰度和可信度，保留事实与 Markdown 结构
category: writing
requiredRoles: [user]
multiRound: false

metadata:
  sourceRepository: https://github.com/op7418/Humanizer-zh
  sourceCommit: 91f3d394db8419c20d67ebe22a96cf8fee0a404b
  sourceLicense: MIT
  adaptation: 仅吸收公开编辑原则与规则；不复制外部代码，不以绕过检测器为目标

variables:
  articleContent:
    description: 待优化文章内容
    required: true
    source: INPUT
    uiType: textarea
    placeholder: 粘贴需要提升表达质量的文章
    maxLength: 20000
  intensity:
    description: 编辑强度（轻度/中度/重度）
    required: false
    source: INPUT
    uiType: select
    defaultValue: medium
    options:
      - label: 轻度（微调表达，保留原结构）
        value: light
      - label: 中度（句法变化 + 词汇替换）
        value: medium
      - label: 重度（深度重写，最大化自然度）
        value: heavy

phases:
  - name: ai_audit
    promptFile: skills/ai-detox/prompts/phase1_ai_audit.md
    model: agnes
    streaming: false
    outputParser: json
    outputKey: auditReport
    variables:
      - name: articleContent
    requireConfirmation: false

  - name: detox_rewrite
    promptFile: skills/ai-detox/prompts/phase2_detox_rewrite.md
    model: agnes
    streaming: true
    outputParser: markdown
    outputKey: detoxedContent
    variables:
      - name: articleContent
      - name: auditReport
        ref: ai_audit
      - name: intensity
    requireConfirmation: false
