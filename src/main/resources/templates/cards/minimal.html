<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    width: 1080px; height: 1920px; overflow: hidden;
    background: #F3F4F6; padding: 60px;
  }
  .card-page {
    position: relative; width: 960px; height: 1800px;
    background: #FFFFFF; border-radius: 24px; padding: 60px;
    box-shadow: 0 4px 24px rgba(17, 24, 39, 0.08);
    display: flex; flex-direction: column;
  }

  /* ── 封面页（极简白净） ── */
  .cover-layout { align-items: flex-start; justify-content: center; text-align: left; padding: 90px 70px; }
  .cover-kicker { font-size: 26px; color: #9CA3AF; font-weight: 600; margin-bottom: 48px;
    letter-spacing: 2px; }
  .cover-title { font-size: 92px; font-weight: 800; color: #111827; line-height: 1.22;
    margin-bottom: 40px; }
  .cover-rule { width: 120px; height: 6px; background: #111827; margin-bottom: 40px; }
  .cover-subtitle { font-size: 38px; color: #4B5563; line-height: 1.7; font-weight: 400; }
  .cover-image { width: 100%; max-height: 420px; object-fit: cover; border-radius: 16px;
    margin-bottom: 48px; }
  .cover-meta { margin-top: 56px; font-size: 26px; color: #9CA3AF; }

  /* ── 内容页（白净简约） ── */
  .content-page { overflow: hidden; }
  .page-title { font-size: 50px; font-weight: 700; color: #111827; margin-bottom: 30px; }
  .card-content { flex: 1; font-size: 34px; line-height: 1.9; color: #1F2937; }
  .card-content h1, .card-content h2 { font-size: 40px; color: #111827; margin: 26px 0 16px; }
  .card-content h3 { font-size: 36px; color: #374151; margin: 20px 0 14px; }
  .card-content p { margin-bottom: 20px; }
  .card-content ul, .card-content ol { padding-left: 44px; margin-bottom: 20px; }
  .card-content li { margin-bottom: 10px; }
  .card-content strong { color: #111827; font-weight: 700; }
  .page-image { width: 100%; max-height: 500px; object-fit: cover; border-radius: 16px;
    margin: 24px 0; }
  .card-page-num { position: absolute; bottom: 48px; right: 70px; font-size: 26px;
    color: #D1D5DB; font-weight: 600; }
</style>
</head>
<body>
<!-- 封面页：左对齐大字标题 + 分隔线 + 副标题，极简留白 -->
<div th:if="${pageType == 'COVER'}" class="card-page cover-layout">
  <div class="cover-kicker">ARTICLE · 文章</div>
  <img th:if="${imageDataUrl}" th:src="${imageDataUrl}" class="cover-image" alt="封面" />
  <div class="cover-title" th:text="${title}">标题</div>
  <div class="cover-rule"></div>
  <div class="cover-subtitle" th:if="${content}" th:text="${content}">副标题</div>
  <div class="cover-meta">阅读 · 思考 · 分享</div>
</div>
<!-- 内容页：章节标题 + 正文 HTML + 配图（pageType 为 null/非 COVER 均按内容页渲染） -->
<div th:unless="${pageType == 'COVER'}" class="card-page content-page">
  <div th:if="${title}" class="page-title" th:text="${title}">章节标题</div>
  <img th:if="${imageDataUrl}" th:src="${imageDataUrl}" class="page-image" alt="配图" />
  <div class="card-content" th:utext="${contentHtml}">正文</div>
  <div class="card-page-num" th:text="${pageNo}">1</div>
</div>
</body>
</html>
