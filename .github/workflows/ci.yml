name: CI — Build & Test & Docker

on:
  push:
    branches: [master, dev, track/*]
  pull_request:
    branches: [master, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --requirepass testpass

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test
        run: mvn verify -B -Dspring.profiles.active=test
        env:
          REDIS_PASSWORD: testpass
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          AGNES_AI_API_KEY: ${{ secrets.AGNES_AI_API_KEY }}

      - name: Build Docker Image
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev'
        run: docker build -t ai-passage-creator:${{ github.sha }} .

      - name: Push Docker Image
        if: github.ref == 'refs/heads/master'
        run: |
          echo "Docker push would go here (configure DOCKER_REGISTRY secret)"
