name: CI — Build & Test

on:
  push:
    branches: [master, dev, track/*]
  pull_request:
    branches: [master, dev]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test
        run: mvn test -B -Dspring.profiles.active=test -Dspring.session.store-type=none

      - name: Build Docker Image
        if: github.ref == 'refs/heads/master'
        run: docker build -t ai-passage-creator:${{ github.sha }} .

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint:check

      - name: Type-check & Build
        working-directory: frontend
        # vite build 能发现 type-check/lint 检测不到的 CSS 编译错误（如纯 CSS 中的 // 注释）
        run: npm run build

      - name: Unit tests
        working-directory: frontend
        run: npm run test:skill
