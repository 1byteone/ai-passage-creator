name: CI — Build & Test

on:
  push:
    branches: [master, dev, track/*]
  pull_request:
    branches: [master, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test
        run: mvn verify -B -Dspring.profiles.active=test
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          AGNES_AI_API_KEY: ${{ secrets.AGNES_AI_API_KEY }}
          WEBHOOK_SHARED_SECRET: ci-test-secret

      - name: Build Docker Image
        if: github.ref == 'refs/heads/master'
        run: docker build -t ai-passage-creator:${{ github.sha }} .
